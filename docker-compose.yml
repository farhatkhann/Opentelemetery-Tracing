services:
  config-server:
    image: springcommunity/spring-petclinic-config-server
    container_name: config-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-I", "http://config-server:8888"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
     - 8888:8888

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    container_name: discovery-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
    ports:
     - 8761:8761

  # ------------------------------------------------------------
  # Jaeger — replaces Zipkin as the trace backend, since collect_traces.py
  # queries Jaeger's HTTP query API (port 16686), not Zipkin's.
  # 4317 = OTLP gRPC, 4318 = OTLP HTTP (what OTEL_EXPORTER_OTLP_ENDPOINT
  # below points at). all-in-one bundles collector + storage + UI/query.
  # ------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=50000
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
     - 16686:16686   # Jaeger UI / query API — what collect_traces.py hits
     - 4317:4317      # OTLP gRPC receiver
     - 4318:4318      # OTLP HTTP receiver

  customers-service:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service
    volumes:
     - ./otel:/otel
    environment:
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=50
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=10
      - SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT=10000
      - MANAGEMENT_TRACING_ENABLED=false    
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=customers-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=off
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
    - 8081:8081

  visits-service:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    image: springcommunity/spring-petclinic-visits-service
    container_name: visits-service
    volumes:
     - ./otel:/otel
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar
      - MANAGEMENT_TRACING_ENABLED=false    
      - OTEL_SERVICE_NAME=visits-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=off
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
     - 8082:8082

  vets-service:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service
    volumes:
     - ./otel:/otel
    environment:
      - MANAGEMENT_TRACING_ENABLED=false    
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=vets-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=off
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
     - 8083:8083

  genai-service:
    image: springcommunity/spring-petclinic-genai-service
    container_name: genai-service
    volumes:
     - ./otel:/otel
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=genai-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=off
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
     - 8084:8084

  api-gateway:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway
    volumes:
     - ./otel:/otel
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=off
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      customers-service:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
     - 8080:8080

  admin-server:
    image: springcommunity/spring-petclinic-admin-server
    container_name: admin-server
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
     - 9090:9090

  ## Grafana / Prometheus

  grafana-server:
    build: ./docker/grafana
    container_name: grafana-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 3030:3000

  prometheus-server:
    build: ./docker/prometheus
    container_name: prometheus-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 9091:9090